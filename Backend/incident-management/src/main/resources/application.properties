# ==========================================
# CONFIGURACION DE BASE DE DATOS (DOCKER)
# ==========================================
# NOTA: Usamos localhost:5433 porque en tu docker-compose mapeaste el puerto externo a 5433.
spring.datasource.url=jdbc:postgresql://localhost:5433/opscore_db
spring.datasource.username=brian_dev
spring.datasource.password=opscore_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACION DE HIKARI (POOL DE CONEXIONES)
# ==========================================
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=4

# ==========================================
# JPA / HIBERNATE (AUTO-CREACION DE TABLAS)
# ==========================================
spring.jpa.open-in-view=false

# Cambie 'create-drop' por 'update' temporalmente.
# 'update' creara las tablas la primera vez y mantendra los datos de tus pruebas en Postman.
# Si prefieres que borre todo cada que apagues el back, puedes regresar a 'create-drop'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logs para auditoria en consola de lo que genere JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# DESACTIVAR FLYWAY
# ==========================================
spring.flyway.enabled=false

# ==========================================
# CONFIGURACION DEL SERVIDOR
# ==========================================
server.port=8081

spring.security.enabled=false