spring.application.name=incident-management

# ============================================================
# DATABASE (PostgreSQL)
# ============================================================
spring.datasource.url=${DB_URL_CONTAINER:jdbc:postgresql://localhost:5432/opscore_db}
spring.datasource.username=${DB_POSTGRES_USERNAME:postgres}
spring.datasource.password=${DB_POSTGRES_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# HIKARI CONNECTION POOL (DEFAULT EN SPRING BOOT)
# ============================================================
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=IncidentHikariPool

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.open-in-view=false

# en producción: none o validate (NO update)
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=true

# ubicación estándar
spring.flyway.locations=classpath:db/migration

# ============================================================
# SERVER
# ============================================================
server.port=8081

# ============================================================
# SECURITY
# ============================================================
security.jwt.access-exp-min=15
security.jwt.refresh-exp-hours=8
